on:
  workflow_dispatch:
  push:
    branches: [develop]
jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Get secrets from Azure Key Vault
        uses: azure/get-keyvault-secrets@v1
        with:
          keyvault: "slom-key"
          secrets: "ConnectionStrings--DefaultConnection, AWS--AccessKey, AWS--SecretKey, AWS--Region, AWS--UserPoolId, AWS--ClientId, AWS--GrantType, AWS--TokenEndpoint, Environment--PAYOS-CLIENT-ID, Environment--PAYOS-API-KEY, Environment--PAYOS-CHECKSUM-KEY"

      - name: Build and Publish
        run: |
          dotnet build --configuration Release
          dotnet publish -c Release -o ./publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'SLOM'
          package: './publish'