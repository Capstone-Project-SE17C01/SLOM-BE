name: CI/CD

on:
    push:
        branches: [develop]
    pull_request:
        branches: [develop]

jobs:
    autoformat:
        name: "Autoformat"
        if: github.event_name != 'pull_request'
        uses: ./.github/workflows/format.yml
        secrets:
            GH_TOKEN: ${{ secrets.GH_TOKEN }}
    
    build-and-test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Setup .NET
              uses: actions/setup-dotnet@v3
              with:
                  dotnet-version: 8.0.x
            - name: Restore dependencies
              run: dotnet restore
            - name: Build with analyzers
              run: dotnet build --no-restore /p:EnforceCodeStyleInBuild=true /p:AnalysisMode=All
            - name: Test
              run: dotnet test --no-build --verbosity normal
            - name: Verify migrations
              run: |
                  dotnet tool install --global dotnet-ef
                  dotnet ef migrations script --idempotent --output=migrations-script.sql --project Project.Infrastructure --startup-project Project.API
              continue-on-error: true
            
            # Publish cho deployment
            - name: Publish
              if: github.ref == 'refs/heads/main'
              run: dotnet publish Project.API/Project.API.csproj -c Release -o ./publish
            
            - name: Upload artifact
              if: github.ref == 'refs/heads/main'
              uses: actions/upload-artifact@v3
              with:
                  name: .net-app
                  path: ./publish

    deploy:
        runs-on: ubuntu-latest
        needs: build-and-test
        if: github.event_name != 'pull_request'
     
        steps:
        - name: Download artifact
          uses: actions/download-artifact@v3
          with:
              name: .net-app
              path: ./publish
        
        - name: Deploy to Azure Web App
          uses: azure/webapps-deploy@v2
          with:
              app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
              publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
              package: ./publish