name: Deploy to Azure

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    env:
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 0 
    - name: Set up .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    
    - name: Cache NuGet packages
      uses: actions/cache@v3
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/Project.*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --configuration Release --no-restore
    - name: Publish
      run: dotnet publish Project.API/Project.API.csproj --configuration Release --no-build --output ./publish
    
    - name: Clean up publish directory
      run: |
        # Remove PDBs (debug files)
        find ./publish -name "*.pdb" -type f -delete
        # Remove any test dlls if they got included
        find ./publish -name "*[Tt]est*.dll" -type f -delete
        # Display package size for debugging
        du -sh ./publish

    - name: Azure Login
      uses: azure/login@v1
      with:
        creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'
    
    - name: Deploy to Azure Web App
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'slom-web-app'
        package: ./publish
    
    - name: Apply Migrations
      uses: azure/CLI@v1
      with:
        inlineScript: |
          # Set up EF Core tools
          dotnet tool install --global dotnet-ef
          
          dotnet ef database update --project Project.Infrastructure --startup-project Project.API
      env:
        ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION_STRING }}
